<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="110" fill="#2d0d03"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="url(#grad)" stroke="#d97706" stroke-width="8"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1e0a02"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Decorative Frame -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="12 6" opacity="0.6"/>
  <!-- Central 'A' Brand Icon -->
  <text x="256" y="340" font-family="'Times New Roman', Georgia, serif" font-size="280" font-weight="900" fill="url(#gold)" text-anchor="middle">A</text>
  <!-- Subtitle -->
  <text x="256" y="420" font-family="'Cairo', sans-serif" font-size="32" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="4">النجار فيرنتشر</text>
</svg>
